# Render blueprint for the DevPilot API as a public, read-only showcase.
# Render dashboard → New → Blueprint → pick this repo. See docs/DEPLOY.md.
services:
  - type: web
    name: devpilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    buildFilter:                # redeploy only when the API changes (not on docs/web pushes)
      paths:
        - apps/api/**
    envVars:
      - key: DEMO_MODE          # read-only showcase: no agent runs, no GitHub calls
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY         # signs session tokens; generated once by Render
        generateValue: true
      - key: DATABASE_URL       # Neon connection string (paste in the dashboard)
        sync: false
      - key: CORS_ORIGINS       # your Vercel URL, e.g. https://devpilot.vercel.app
        sync: false
      # Trust X-Forwarded-For from Render's proxy so per-IP rate limits see the
      # real client (uvicorn otherwise only trusts 127.0.0.1). Safe only because
      # Render's proxy is the sole way in.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Password reset (docs/password-reset.md)
      - key: FRONTEND_URL       # the Vercel URL; reset links point here
        sync: false
      - key: EMAIL_BACKEND
        value: resend
      - key: EMAIL_FROM         # on your Resend-verified domain, e.g. DevPilot <noreply@yourdomain.com>
        sync: false
      - key: RESEND_API_KEY     # secret: Resend API key with sending access
        sync: false
      - key: BOOTSTRAP_USER_EMAIL  # optional: your account (set its password via reset)
        sync: false
      - key: GOOGLE_CLIENT_ID   # optional: enables "Sign in with Google" (public value)
        sync: false
